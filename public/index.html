<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>EVS Neuron View Control</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- Screen A: pick a head. No header — the grid uses the full height; panel identity is the
         floating item (bottom-right, below). -->
    <section class="screen screen-heads show" id="screenHeads">
      <div class="stage">
        <div class="grid" id="grid"></div>
      </div>
    </section>

    <!-- Screen B: unified per-head menu — left: snapshot list (scrolls); right: live editor (fixed) -->
    <section class="screen screen-menu" id="screenMenu">
      <div class="menu-left">
        <div class="menu-left-head">
          <span class="menu-title" id="menuHeadLabel">Head</span>
          <div class="grow"></div>
          <div class="showall-slot" id="showAllSlot"></div>
        </div>
        <div class="snap-list" id="snapList"></div>
      </div>
      <!-- Editor fills the whole pane (no header) so the stage is as large as possible.
           Home lives in the floating item (bottom-right, below). -->
      <div class="menu-right">
        <div class="fs-editor" id="fsEditor">
          <div class="fs-hint" id="fsHint">Tap a window to change its input · press and hold to make it fullscreen</div>
          <div class="fs-body" id="fsBody">
            <div class="fs-stage-wrap" id="fsStageWrap"></div>
            <!-- On-screen numeric keypad for input-group entry (appears when a window is selected). -->
            <div class="fs-keypad" id="fsKeypad" aria-hidden="true"></div>
          </div>
        </div>
        <div class="toast fs-toast" id="fsToast"></div>
      </div>
    </section>

    <!-- Floating item, bottom-right: shows the panel name/IP on the home screen and becomes the
         Home button inside a menu. Sits under the confirm dialog (lower z-index). -->
    <div class="floater" id="floater">
      <div class="floater-panel">
        <span class="panelinfo-label" id="panelLabel">Neuron MV Control</span>
        <span class="panelinfo-sub" id="panelSub">Locating panel…</span>
      </div>
      <button class="floater-home" id="homeBtn" aria-label="Home">
        <span class="btn-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.8 12 3l9 7.8"/><path d="M5.5 9.5V21h13V9.5"/></svg></span>
      </button>
    </div>
  </div>

  <!-- Confirm overlay -->
  <div class="overlay" id="overlay">
    <div class="sheet">
      <h3>Confirm snapshot recall</h3>
      <div class="confirm-lines" id="confirmLines"></div>
      <div class="row">
        <button class="btn ghost" id="cancelBtn">Cancel</button>
        <button class="btn arm" id="fireBtn">Load snapshot</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="bkbanner" id="bkBanner">
    <span class="bkbanner-msg" id="bkBannerMsg"></span>
    <button class="bkbanner-x" id="bkBannerX" aria-label="Dismiss">✕</button>
  </div>

  <script src="shared.js"></script>
  <script src="app.js"></script>
</body>
</html>
